name: sika_app
description: "SIKA - Personal Finance Management pour le Gabon"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ===== DRIFT (SQLite ORM) =====
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.41
  sqlite3: ^2.5.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # ===== STATE MANAGEMENT =====
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ===== UTILITIES =====
  uuid: ^4.5.1
  intl: ^0.20.2
  timezone: ^0.9.4

  # ===== SECURITY =====
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  safe_device: ^1.1.4
  crypto: ^3.0.6

  # ===== BACKGROUND SERVICE =====
  flutter_background_service: ^5.0.5

  # ===== NOTIFICATIONS =====
  flutter_local_notifications: ^18.0.1

  # ===== STORAGE =====
  shared_preferences: ^2.3.3
  dtd: ^4.0.0
  flutter_lints: ^6.0.0
  google_fonts: ^6.3.3
  json_rpc_2: ^4.0.0
  stack_trace: ^1.12.1
  url_launcher: ^6.3.2
  web: ^1.1.1
  font_awesome_flutter: ^10.7.0
  fl_chart: ^0.69.2
  flutter_svg: ^2.0.10
  google_generative_ai: ^0.4.6

  # ===== OCR / AI Receipt Scanner =====
  image_picker: ^1.1.2
  http: ^1.2.2

  # ===== AUTH & CLOUD =====
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.1
  
  # ===== POWERSYNC (Offline-First Sync) =====
  powersync: ^1.17.0
  connectivity_plus: ^7.0.0
  flutter_dotenv: ^6.0.0


  equatable: any
  sentry_flutter: ^9.14.0
  posthog_flutter: ^5.18.0
dev_dependencies:
  flutter_test:
    sdk: flutter


  # ===== CODE GENERATION =====
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.2

  # ===== LAUNCHER ICON & SPLASH =====
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0

# ===== LAUNCHER ICON CONFIG =====
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/launcher.png"
  adaptive_icon_background: "#303F9F"
  adaptive_icon_foreground: "assets/icons/launcher.png"
  min_sdk_android: 21

# ===== SPLASH SCREEN CONFIG =====
# Native splash désactivé - on utilise le splash screen Flutter custom
flutter_native_splash:
  color: "#FFFFFF"
  android: true
  ios: true
  fullscreen: false
  android_12:
    color: "#FFFFFF"

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/
    - assets/icons/

